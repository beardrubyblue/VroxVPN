[package]
name = "app"
version = "4.0.0"
description = "vrox.vpn — Hysteria2 VPN клиент"
authors = ["Vroxory"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
reqwest = { version = "0.13.4", features = ["json"] }
serde_yaml = "0.9.34"
base64 = "0.22.1"
url = "2.5.8"
percent-encoding = "2.3.2"
dirs = "6.0.0"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["process", "rt", "time"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
sha2 = "0.10"
hex = "0.4"
# Автообновление на Linux — свой механизм (download + privileged
# dpkg -i, см. engine::linux::install_update / commands::
# install_update_linux). На macOS обновления идут через TestFlight
# (App Store Connect сам всё доставляет) — штатный tauri-plugin-updater
# здесь НЕ используется (не нужен: TestFlight и так не умеет .deb,
# а отдельно поддерживать его для одной macOS-ветки, когда у неё уже
# есть свой канал обновлений, избыточно).
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Импорт WireGuard-конфигов: файл (dialog) и QR (barcode-scanner) —
# только iOS, на Linux WireGuard пока не поддерживается.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-dialog = "2.8"
tauri-plugin-barcode-scanner = "2.5"

# Linux пишет историю трафика сам (traffic_history/recorder.rs) — нужна
# локальная дата; на iOS даты ставит расширение (Go).
[target.'cfg(target_os = "linux")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-network-extension = "0.3.2"

# ВРЕМЕННО: swift-rs с фиксом из PR Brendonovich/swift-rs#82 (issue #81).
# На Xcode 27 SwiftPM делает @_cdecl-экспорты статических библиотек
# локальными; swift-rs 1.0.8 возвращает им глобальность только в объекте
# самого пакета (Tauri.o), но не в общем рантайм-шиме SwiftRs.o — iOS-
# сборка падала на линковке libapp_lib.dylib: «Undefined symbols:
# _retain_object, _release_object, _string_from_bytes». Rev закреплён.
# Убрать, как только фикс выйдет в релизе swift-rs на crates.io.
# Требует `rustup component add llvm-tools` (llvm-objcopy).
[patch.crates-io]
swift-rs = { git = "https://github.com/michakfromparis/swift-rs", rev = "3788d3d2bae8e7a863b3e281a59477438e12c632" }
