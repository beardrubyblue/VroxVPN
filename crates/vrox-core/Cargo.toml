[package]
name = "vrox-core"
version = "4.0.0"
description = "vrox.vpn — общая логика клиента и шлюза: подписки, конфиг hysteria2, RU-обход, пинг"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
reqwest = "0.13.4"
base64 = "0.22.1"
url = "2.5.8"
percent-encoding = "2.3.2"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["process", "time"] }
