# UDP-буферы сокетов для QUIC (hysteria2). Дефолт Ubuntu — 208 КБ, а
# quic-go просит ~7 МБ и молча получает меньше: на 250-300 Мбит/с буфер
# переполняется, ядро роняет пакеты, BBR сервера видит потери и
# сбрасывает скорость (спидтест через шлюз разгонялся и падал до 10-70).
# Значение — рекомендация quic-go (wiki «UDP Buffer Sizes»).
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
