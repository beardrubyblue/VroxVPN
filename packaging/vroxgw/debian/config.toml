# vroxgw — шлюз vrox.vpn. После правки: sudo systemctl restart vroxgw

# Ссылка на подписку (та же, что в приложении).
subscription_url = ""

# "auto" — лучший узел по пингу, иначе точное имя узла (vroxgw nodes).
node = "auto"

# Российские сайты и IP — напрямую, мимо VPN.
ru_bypass = true

# Тоннель упал — у клиентов нет интернета (а не прямой выход мимо VPN).
killswitch = true

# Подсеть клиентов, чей трафик идёт через шлюз.
lan = "192.168.1.0/24"

# Как часто перечитывать подписку, часов.
refresh_hours = 6
