name: VroxVPNNetworkExtension
options:
  bundleIdPrefix: com.vroxory.vpn
  deploymentTarget:
    # 13.3/16.4 (не 12.0/16.0) — минимум для excludeAPNs/
    # excludeCellularServices (NEVPNProtocol), которые мы теперь
    # реально используем (engine/macos/connect/mod.rs) — иначе
    # "unrecognized selector" на старых системах в рантайме.
    macOS: "13.3"
    iOS: "16.4"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: QRZT5R3Q28
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "13.3"
    SWIFT_VERSION: "5.0"
    # Дефолт, чтобы $(CURRENT_PROJECT_VERSION) в Info.plist никогда не
    # подставлялся пустым ("null" в логе сборки) — реальный build-номер
    # для архива передаётся снаружи (build-testflight.sh / Xcode archive
    # action через -allowProvisioningUpdates всё равно использует то,
    # что задано тут, если явно не переопределили).
    CURRENT_PROJECT_VERSION: "1"

targets:
  VroxVPNHost:
    type: application
    platform: macOS
    # Явная схема в project.yml (а не созданная руками в Xcode) — иначе
    # `xcodegen generate` сносит локально созданные схемы, и
    # build-testflight*.sh падает с "does not contain a scheme". Пустой
    # scheme: {} даёт xcodegen стандартный набор action'ов (build/run/
    # archive с Release-конфигом) для этого таргета.
    scheme: {}
    sources:
      - VroxVPNHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroxory.vpn
        INFOPLIST_FILE: VroxVPNHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: VroxVPNHost/VroxVPNHost.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # main.swift делает явный bootstrap (NSApplication.shared.delegate
        # = ...) вместо @main/@NSApplicationMain — это не совмещается с
        # Xcode "debug dylib" (быстрая инкрементальная сборка через
        # __debug_main_executable_dylib_entry_point), линковщик не находит
        # _main. Фича на ускорение разработки, не нужна для наших целей.
        ENABLE_DEBUG_DYLIB: NO
      # Release-конфиг для build-testflight.sh: подпись Apple Distribution
      # под отдельно созданным на developer.apple.com профилем "Mac App
      # Store Connect" — Automatic-подпись (base) переключается на
      # Distribution-сертификат только во время реального archive-action
      # в Xcode, а build-testflight.sh гонит plain `xcodebuild ... build`,
      # без archive. Раньше это правилось вручную прямо в
      # project.pbxproj (он gitignored, регенерируется), из-за чего
      # правка слетала при каждом `xcodegen generate` — переносим в
      # project.yml, чтобы она переживала регенерацию.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "vrox.vpn App Store"
    dependencies:
      - target: VroxTunnelExtension
        embed: true
        codeSign: true

  VroxTunnelExtension:
    type: app-extension
    platform: macOS
    scheme: {}
    sources:
      - VroxTunnelExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroxory.vpn.tunnel
        INFOPLIST_FILE: VroxTunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: VroxTunnelExtension/VroxTunnelExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "vrox.vpn tunnel App Store"
    dependencies:
      - framework: Frameworks/GoNetunnel.xcframework
        embed: false

  # iOS/iPadOS-вариант — для разработки/прогона прямо из Xcode на
  # симуляторе/устройстве. Никакого Tauri/WebView здесь нет и не может
  # быть (это десктопный Rust-стек) — это самостоятельный SwiftUI-хост,
  # параллельный VroxVPNHost, не замена ему. AppKit-исходники
  # VroxVPNHost/* не переиспользуются (не компилируются под iOS),
  # PacketTunnelProvider.swift переиспользуется как есть — он уже не
  # завязан на AppKit/UIKit (Darwin/NetworkExtension/os.log только).
  #
  # ⚠ NEPacketTunnelProvider исторически не работает в iOS Simulator —
  # реальный тоннель проверяется только на физическом устройстве; на
  # симуляторе можно прогнать только сам SwiftUI-хост.
  VroxVPNHost-iOS:
    type: application
    platform: iOS
    # Нужна build-testflight-ios.sh (-scheme VroxVPNHost-iOS) — см.
    # комментарий про scheme у VroxVPNHost выше.
    scheme: {}
    sources:
      - VroxVPNHost-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroxory.vpn
        # "vrox.vpn", не "VroxVPNHost" — чтобы в Xcode Organizer архив
        # назывался так же, как macOS-архив (там имя берётся из
        # реального Tauri-бандла, см. build-testflight.sh), а не как
        # внутреннее имя Xcode-таргета тест-харнесса.
        PRODUCT_NAME: vrox.vpn
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "4.0.0"
        CODE_SIGN_ENTITLEMENTS: VroxVPNHost-iOS/VroxVPNHost-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad — универсальный таргет
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Без иконки в Organizer/TestFlight архив показывает заглушку —
        # временно взял существующую иконку Tauri-приложения (app/src-
        # tauri/icons/icon.png, upscale 512→1024 + убрана alpha-прозрачность,
        # App Store Connect её не принимает) как плейсхолдер.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store Connect отклоняет архив без этого (Validate App
        # выдаёт "All interface orientations must be supported unless
        # the app requires full screen") — тест-харнесс, ориентация не
        # важна по сути, но без полного списка не пройти валидацию.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      # Тот же приём, что и для macOS-таргетов выше — Release-подпись
      # под отдельно выпущенными "iOS App Store"-профилями (другой тип
      # профиля и другой App ID-scope, чем "Mac App Store Connect" у
      # macOS-таргетов, хотя сертификат Apple Distribution общий).
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "vrox.vpn iOS App Store"
    dependencies:
      - target: VroxTunnelExtension-iOS
        embed: true
        codeSign: true

  VroxTunnelExtension-iOS:
    type: app-extension
    platform: iOS
    scheme: {}
    sources:
      - path: VroxTunnelExtension/PacketTunnelProvider.swift
        group: VroxTunnelExtension-iOS
      - VroxTunnelExtension-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vroxory.vpn.tunnel
        PRODUCT_NAME: VroxTunnelExtension
        INFOPLIST_FILE: VroxTunnelExtension-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: VroxTunnelExtension-iOS/VroxTunnelExtension-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "vrox.vpn tunnel iOS App Store"
    dependencies:
      - framework: Frameworks/GoNetunnel.xcframework
        embed: false
